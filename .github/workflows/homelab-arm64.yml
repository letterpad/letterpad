name: Letterpad homelab ARM64

on:
  push:
    branches: [homelab-arm64, homelab-sso]
  workflow_dispatch:
    inputs:
      admin_url:
        description: Public HTTPS origin for the admin app
        required: true
        default: https://letterpad-admin.test
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image names and public admin origin
        id: image
        env:
          ADMIN_URL: ${{ inputs.admin_url || 'https://letterpad-admin.test' }}
        run: |
          if [[ ! "$ADMIN_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "Enter an HTTPS origin without a trailing slash or path."
            exit 1
          fi
          echo "admin_url=$ADMIN_URL" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-homelab" >> "$GITHUB_OUTPUT"
          origin_hash=$(printf '%s' "$ADMIN_URL" | sha256sum | cut -c1-12)
          echo "tag=${GITHUB_SHA}-${origin_hash}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.homelab
          target: admin
          platforms: linux/arm64
          build-args: LETTERPAD_ADMIN_URL=${{ steps.image.outputs.admin_url }}
          tags: ${{ steps.image.outputs.prefix }}-admin:${{ steps.image.outputs.tag }}
          push: true

      - name: Build and publish client
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.homelab
          target: client
          platforms: linux/arm64
          build-args: LETTERPAD_ADMIN_URL=${{ steps.image.outputs.admin_url }}
          tags: ${{ steps.image.outputs.prefix }}-client:${{ steps.image.outputs.tag }}
          push: true
