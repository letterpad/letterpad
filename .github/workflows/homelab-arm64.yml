name: Letterpad homelab ARM64

on:
  push:
    branches: [homelab-arm64, homelab-sso]
  workflow_dispatch:
    inputs:
      admin_url:
        description: Public HTTPS origin for the admin app
        required: true
        default: https://letterpad-admin.test
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [admin, client]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image names and public admin origin
        id: image
        env:
          ADMIN_URL: ${{ inputs.admin_url || 'https://letterpad-admin.test' }}
        run: |
          if [[ ! "$ADMIN_URL" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]; then
            echo "Enter an HTTPS origin without a trailing slash or path."
            exit 1
          fi
          echo "admin_url=$ADMIN_URL" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}-homelab" >> "$GITHUB_OUTPUT"
          origin_hash=$(printf '%s' "$ADMIN_URL" | sha256sum | cut -c1-12)
          echo "tag=${GITHUB_SHA}-${origin_hash}" >> "$GITHUB_OUTPUT"
          echo "origin_hash=$origin_hash" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.homelab
          target: ${{ matrix.app }}
          platforms: linux/arm64
          build-args: LETTERPAD_ADMIN_URL=${{ steps.image.outputs.admin_url }}
          tags: ${{ steps.image.outputs.prefix }}-${{ matrix.app }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,version=2,scope=letterpad-arm64-${{ matrix.app }}-${{ steps.image.outputs.origin_hash }}
          cache-to: type=gha,version=2,scope=letterpad-arm64-${{ matrix.app }}-${{ steps.image.outputs.origin_hash }},mode=max,ignore-error=true
          push: true
