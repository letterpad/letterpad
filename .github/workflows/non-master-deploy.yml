name: PR Checks

on:
  push:
    branches-ignore:
      - master

permissions:
  contents: read

env:
  BUN_VERSION: '1.0.21'
  NEXT_PUBLIC_ROOT_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3000/api/graphql

jobs:
  checks:
    name: PR Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install
        run: bun install --ignore-scripts
      - name: Lint
        run: bun run lint

  job_two:
    name: Cypress Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: letterpad
          POSTGRES_PASSWORD: letterpad
          POSTGRES_DB: letterpad
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U letterpad -d letterpad"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/.cache/Cypress
      DATABASE_URL: postgresql://letterpad:letterpad@127.0.0.1:5432/letterpad
      DIRECT_URL: postgresql://letterpad:letterpad@127.0.0.1:5432/letterpad
      ROOT_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000/api/auth
      SECRET_KEY: some-secret
      STRIPE_SECRET_KEY: sk_test_build_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore Turbo build artifacts
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: letterpad-turbo-pr-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('bun.lockb', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            letterpad-turbo-pr-v1-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('bun.lockb', 'turbo.json') }}-

      - name: Install
        run: bun install --ignore-scripts

      - name: Prepare admin and generate Prisma Client
        run: |
          cp apps/admin/.env.sample apps/admin/.env
          ./node_modules/.bin/prisma generate --schema=apps/admin/prisma/postgres/schema_postgres.prisma
          ./node_modules/.bin/prisma migrate deploy --schema=apps/admin/prisma/postgres/schema_postgres.prisma

      - name: Build admin
        run: ./node_modules/.bin/turbo run build --filter=admin --cache-dir=.turbo/cache --env-mode=loose

      - name: Save Turbo build artifacts
        if: steps.turbo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: ${{ steps.turbo-cache.outputs.cache-primary-key }}

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ${{ env.CYPRESS_CACHE_FOLDER }}
          key: letterpad-cypress-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('apps/admin/package.json', 'bun.lockb') }}

      - name: Run Cypress
        run: |
          ./node_modules/.bin/cypress install
          bun run e2e:ci --env-mode=loose
        env:
          NODE_ENV: test
          RECAPTCHA_KEY_CLIENT: 6Lf3a9QjAAAAALIzxbDw5MX9-Mu_ZjH8NLzRxAAc # test key
          RECAPTCHA_KEY_SERVER: 6Lf3a9QjAAAAAKwvGzcmUTJNaEcnxNqu7hU0giDI # test key
